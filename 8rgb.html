<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8RGB指定</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --panel: #141414;
    --border: #2a2a2a;
    --text: #e0e0e0;
    --muted: #555;
    --accent: #fff;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .container {
    width: 100%;
    max-width: 420px;
  }

  h1 {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  /* カラープレビュー */
  .color-preview {
    width: 100%;
    height: 160px;
    border-radius: 4px;
    margin-bottom: 16px;
    transition: background 0.15s ease;
    border: 1px solid var(--border);
  }

  /* コード表示 */
  .codes {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 28px;
  }

  .code-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px 14px;
  }

  .code-label {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  .code-value {
    font-family: 'Space Mono', monospace;
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.05em;
    cursor: pointer;
    user-select: all;
  }

  .code-value:hover {
    opacity: 0.7;
  }

  /* スライダー */
  .sliders {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .slider-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .channel-label {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    width: 16px;
    text-align: center;
    color: var(--muted);
  }

  .channel-label.r { color: #ff4444; }
  .channel-label.g { color: #44ff44; }
  .channel-label.b { color: #4488ff; }

  .steps {
    display: flex;
    gap: 4px;
    flex: 1;
  }

  .step-btn {
    flex: 1;
    height: 36px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: var(--panel);
    cursor: pointer;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    transition: all 0.1s ease;
    position: relative;
  }

  .step-btn:hover {
    border-color: #444;
  }

  .step-btn.active {
    border-color: var(--accent);
    color: var(--accent);
  }

  .value-display {
    font-family: 'Space Mono', monospace;
    font-size: 18px;
    font-weight: 700;
    width: 24px;
    text-align: center;
    color: var(--accent);
  }

  .footer {
    margin-top: 32px;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    font-family: 'Space Mono', monospace;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<div class="container">
  <h1>8RGB Specification</h1>

  <div class="color-preview" id="preview"></div>

  <div class="codes">
    <div class="code-row">
      <span class="code-label">8RGB</span>
      <span class="code-value" id="code8rgb" title="クリックでコピー"></span>
    </div>
    <div class="code-row">
      <span class="code-label">HEX</span>
      <span class="code-value" id="codeHex" title="クリックでコピー"></span>
    </div>
  </div>

  <div class="sliders">
    <div class="slider-row">
      <span class="channel-label r">R</span>
      <div class="steps" id="steps-r"></div>
      <span class="value-display" id="val-r">0</span>
    </div>
    <div class="slider-row">
      <span class="channel-label g">G</span>
      <div class="steps" id="steps-g"></div>
      <span class="value-display" id="val-g">0</span>
    </div>
    <div class="slider-row">
      <span class="channel-label b">B</span>
      <div class="steps" id="steps-b"></div>
      <span class="value-display" id="val-b">0</span>
    </div>
  </div>

  <div class="footer">各チャンネル 0〜7 の 8 段階 · 512色</div>
</div>

<script>
  const state = { r: 0, g: 5, b: 6 };

  function toRGB255(v) {
    if (v === 0) return 0;
    if (v === 7) return 255;
    return Math.round(v * 255 / 7);
  }

  function toHex(v) {
    return toRGB255(v).toString(16).padStart(2, '0').toUpperCase();
  }

  function update() {
    const { r, g, b } = state;
    const R = toRGB255(r), G = toRGB255(g), B = toRGB255(b);
    const hex = `#${toHex(r)}${toHex(g)}${toHex(b)}`;
    const code8 = `#$${r}${g}${b}`;

    document.getElementById('preview').style.background = hex;
    document.getElementById('code8rgb').textContent = code8;
    document.getElementById('codeHex').textContent = hex;

    document.getElementById('val-r').textContent = r;
    document.getElementById('val-g').textContent = g;
    document.getElementById('val-b').textContent = b;

    ['r', 'g', 'b'].forEach(ch => {
      document.querySelectorAll(`#steps-${ch} .step-btn`).forEach(btn => {
        btn.classList.toggle('active', parseInt(btn.dataset.val) === state[ch]);
        const v = parseInt(btn.dataset.val);
        const rv = ch === 'r' ? toRGB255(v) : toRGB255(state.r);
        const gv = ch === 'g' ? toRGB255(v) : toRGB255(state.g);
        const bv = ch === 'b' ? toRGB255(v) : toRGB255(state.b);
        btn.style.background = `rgb(${rv},${gv},${bv})`;
      });
    });
  }

  function buildSteps(ch) {
    const container = document.getElementById(`steps-${ch}`);
    for (let i = 0; i < 8; i++) {
      const btn = document.createElement('button');
      btn.className = 'step-btn';
      btn.dataset.val = i;
      btn.title = i;
      btn.addEventListener('click', () => {
        state[ch] = i;
        update();
      });
      container.appendChild(btn);
    }
  }

  ['r', 'g', 'b'].forEach(buildSteps);

  // コピー
  ['code8rgb', 'codeHex'].forEach(id => {
    document.getElementById(id).addEventListener('click', function() {
      navigator.clipboard.writeText(this.textContent).catch(() => {});
    });
  });

  update();
</script>
</body>
</html>
