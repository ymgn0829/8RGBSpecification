<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8RGB指定</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --panel: #f5f5f5;
    --border: #dddddd;
    --text: #111111;
    --muted: #888;
    --accent: #111111;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .container {
    width: 100%;
    max-width: 440px;
  }

  h1 {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 13px;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  /* 3分割プレビュー */
  .preview-wrap {
    display: flex;
    gap: 4px;
    margin-bottom: 16px;
    height: 120px;
  }

  .swatch {
    flex: 1;
    border-radius: 4px;
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 8px;
    transition: background 0.1s ease;
    cursor: default;
  }

  .swatch.main {
    flex: 2;
    border: 2px solid #111;
  }

  .swatch-label {
    font-size: 10px;
    font-family: 'Noto Sans JP', sans-serif;
    color: rgba(0,0,0,0.35);
    font-weight: 700;
  }

  .swatch-label.light {
    color: rgba(255,255,255,0.6);
  }

  /* コード表示 */
  .codes {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 20px;
  }

  .code-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px 14px;
  }

  .code-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  .code-value {
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.05em;
    cursor: pointer;
    user-select: all;
  }

  .code-value:hover { opacity: 0.6; }

  /* チャンネル選択タブ */
  .ch-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
  }

  .ch-tab {
    padding: 5px 14px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: var(--panel);
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    transition: all 0.1s;
    font-family: 'Noto Sans JP', sans-serif;
  }

  .ch-tab.active { border-color: #111; color: #111; }
  .ch-tab.r.active { border-color: #e00; color: #e00; }
  .ch-tab.g.active { border-color: #080; color: #080; }
  .ch-tab.b.active { border-color: #00c; color: #00c; }

  /* スライダー */
  .sliders {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .channel-label {
    font-size: 13px;
    font-weight: 700;
    width: 16px;
    text-align: center;
  }

  .channel-label.r { color: #cc0000; }
  .channel-label.g { color: #006600; }
  .channel-label.b { color: #0000cc; }

  .steps {
    display: flex;
    gap: 3px;
    flex: 1;
  }

  .step-btn {
    flex: 1;
    height: 34px;
    border: 1px solid var(--border);
    border-radius: 3px;
    cursor: pointer;
    font-size: 10px;
    font-family: 'Noto Sans JP', sans-serif;
    transition: all 0.1s ease;
  }

  .step-btn:hover { border-color: #999; }
  .step-btn.active { border: 2px solid #111; }

  .value-display {
    font-size: 18px;
    font-weight: 700;
    width: 22px;
    text-align: center;
    color: var(--accent);
  }

  .footer {
    margin-top: 28px;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<div class="container">
  <h1>8RGB Specification</h1>

  <!-- 3分割プレビュー -->
  <div class="preview-wrap">
    <div class="swatch" id="swatch-prev">
      <span class="swatch-label" id="label-prev"></span>
    </div>
    <div class="swatch main" id="swatch-main">
      <span class="swatch-label" id="label-main"></span>
    </div>
    <div class="swatch" id="swatch-next">
      <span class="swatch-label" id="label-next"></span>
    </div>
  </div>

  <!-- コード -->
  <div class="codes">
    <div class="code-row">
      <span class="code-label">8RGB</span>
      <span class="code-value" id="code8rgb" title="クリックでコピー"></span>
    </div>
    <div class="code-row">
      <span class="code-label">HEX</span>
      <span class="code-value" id="codeHex" title="クリックでコピー"></span>
    </div>
  </div>

  <!-- 比較チャンネル選択 -->
  <div class="ch-tabs">
    <span style="font-size:11px;color:var(--muted);align-self:center;">比較軸:</span>
    <button class="ch-tab r active" data-ch="r">R</button>
    <button class="ch-tab g" data-ch="g">G</button>
    <button class="ch-tab b" data-ch="b">B</button>
  </div>

  <!-- スライダー -->
  <div class="sliders">
    <div class="slider-row">
      <span class="channel-label r">R</span>
      <div class="steps" id="steps-r"></div>
      <span class="value-display" id="val-r">0</span>
    </div>
    <div class="slider-row">
      <span class="channel-label g">G</span>
      <div class="steps" id="steps-g"></div>
      <span class="value-display" id="val-g">0</span>
    </div>
    <div class="slider-row">
      <span class="channel-label b">B</span>
      <div class="steps" id="steps-b"></div>
      <span class="value-display" id="val-b">0</span>
    </div>
  </div>

  <div class="footer">各チャンネル 0〜7 の 8 段階 · 512色</div>
</div>

<script>
  const state = { r: 0, g: 5, b: 6 };
  let compareChannel = 'r';

  function toRGB255(v) {
    if (v === 0) return 0;
    if (v === 7) return 255;
    return Math.round(v * 255 / 7);
  }

  function toHex255(v) {
    return toRGB255(v).toString(16).padStart(2, '0').toUpperCase();
  }

  function makeBg(r, g, b) {
    return `rgb(${toRGB255(r)},${toRGB255(g)},${toRGB255(b)})`;
  }

  function makeHex(r, g, b) {
    return `#${toHex255(r)}${toHex255(g)}${toHex255(b)}`;
  }

  function isLight(r, g, b) {
    return (0.299 * toRGB255(r) + 0.587 * toRGB255(g) + 0.114 * toRGB255(b)) > 160;
  }

  function update() {
    const { r, g, b } = state;

    // メインコード
    document.getElementById('code8rgb').textContent = `#$${r}${g}${b}`;
    document.getElementById('codeHex').textContent = makeHex(r, g, b);

    // 値表示
    document.getElementById('val-r').textContent = r;
    document.getElementById('val-g').textContent = g;
    document.getElementById('val-b').textContent = b;

    // 3分割プレビュー
    const ch = compareChannel;
    const cur = state[ch];
    const prev = Math.max(0, cur - 1);
    const next = Math.min(7, cur + 1);

    function swatchColor(val) {
      const rr = ch === 'r' ? val : r;
      const gg = ch === 'g' ? val : g;
      const bb = ch === 'b' ? val : b;
      return { rr, gg, bb };
    }

    const pc = swatchColor(prev);
    const mc = swatchColor(cur);
    const nc = swatchColor(next);

    const swatchPrev = document.getElementById('swatch-prev');
    const swatchMain = document.getElementById('swatch-main');
    const swatchNext = document.getElementById('swatch-next');

    swatchPrev.style.background = makeBg(pc.rr, pc.gg, pc.bb);
    swatchMain.style.background = makeBg(mc.rr, mc.gg, mc.bb);
    swatchNext.style.background = makeBg(nc.rr, nc.gg, nc.bb);

    const labelClass = (rr, gg, bb) => isLight(rr, gg, bb) ? '' : 'light';

    document.getElementById('label-prev').textContent = prev === cur ? '—' : `${ch.toUpperCase()}=${prev}`;
    document.getElementById('label-prev').className = `swatch-label ${labelClass(pc.rr, pc.gg, pc.bb)}`;
    document.getElementById('label-main').textContent = `${ch.toUpperCase()}=${cur}`;
    document.getElementById('label-main').className = `swatch-label ${labelClass(mc.rr, mc.gg, mc.bb)}`;
    document.getElementById('label-next').textContent = next === cur ? '—' : `${ch.toUpperCase()}=${next}`;
    document.getElementById('label-next').className = `swatch-label ${labelClass(nc.rr, nc.gg, nc.bb)}`;

    // ステップボタン
    ['r', 'g', 'b'].forEach(ch2 => {
      document.querySelectorAll(`#steps-${ch2} .step-btn`).forEach(btn => {
        const v = parseInt(btn.dataset.val);
        btn.classList.toggle('active', v === state[ch2]);
        const rr = ch2 === 'r' ? v : r;
        const gg = ch2 === 'g' ? v : g;
        const bb = ch2 === 'b' ? v : b;
        btn.style.background = makeBg(rr, gg, bb);
      });
    });
  }

  function buildSteps(ch) {
    const container = document.getElementById(`steps-${ch}`);
    for (let i = 0; i < 8; i++) {
      const btn = document.createElement('button');
      btn.className = 'step-btn';
      btn.dataset.val = i;
      btn.addEventListener('click', () => {
        state[ch] = i;
        update();
      });
      container.appendChild(btn);
    }
  }

  ['r', 'g', 'b'].forEach(buildSteps);

  // 比較チャンネル切り替え
  document.querySelectorAll('.ch-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.ch-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      compareChannel = tab.dataset.ch;
      update();
    });
  });

  // コピー
  ['code8rgb', 'codeHex'].forEach(id => {
    document.getElementById(id).addEventListener('click', function() {
      navigator.clipboard.writeText(this.textContent).catch(() => {});
    });
  });

  update();
</script>
</body>
</html>
