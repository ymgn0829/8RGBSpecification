  .info-codes { display: flex; flex-direction: column; gap: 2px; }

  .info-code span { font-weight: 700; color: #111; }

  .info-empty { color: #bbb; font-size: 13px; }

<div class="footer">L無視・HSのみでプロット · <a href="https://x.com/yxmxgxn" target="_blank" style="color:#aaa;">@yxmxgxn</a></div>

<script>
const members = [

  {name:"小野瑞歩",color:"エメラルドグリーン",hex:"#00b2a9"},

  {name:"斉藤円香",color:"シーブルー",hex:"#59cbe8"},

  {name:"野中美希",color:"パープル",hex:"#582c83"},
  {name:"石山咲良",color:"パープル",hex:"#582c83"},
  {name:"河西結心",color:"パープル",hex:"#582c83"},
  {name:"平井美葉",color:"パープル",hex:"#582c83"},
  {name:"西﨑美空",color:"パープル",hex:"#582c83"},
  {name:"小田さくら",color:"ラベンダー",hex:"#A05EB5"},
  {name:"入江里咲",color:"ライトパープル",hex:"#c1a7e2"},
  {name:"谷本安美",color:"ライトパープル",hex:"#c1a7e2"},
  {name:"村越彩菜",color:"ライトパープル",hex:"#c1a7e2"},
  {name:"弓桁朱琴",color:"ピュアレッド",hex:"#db0025"},
  {name:"下井谷幸穂",color:"ホットピンク",hex:"#da1884"},
  {name:"西田汐里",color:"ホットピンク",hex:"#da1884"},
  {name:"米村姫良々",color:"イタリアンレッド",hex:"#e70033"},
  {name:"小野田紗栞",color:"ピーチ",hex:"#f99fc9"},
  {name:"橋迫鈴",color:"ピュアレッド",hex:"#e70033"},
  {name:"川嶋美楓",color:"ピュアレッド",hex:"#e70033"},
  {name:"吉田姫杷",color:"ピュアレッド",hex:"#e70033"},
  {name:"牧野真莉愛",color:"ピンク",hex:"#F57EB6"},
  {name:"為永幸音",color:"ピンク",hex:"#F57EB6"},
  {name:"工藤由愛",color:"ピンク",hex:"#F57EB6"},
  {name:"岡村美波",color:"ピンク",hex:"#F57EB6"},
  {name:"窪田七海",color:"ピンク",hex:"#F57EB6"},
  {name:"小野田華凜",color:"ピンク",hex:"#F57EB6"},
  {name:"村田結生",color:"ライトピンク",hex:"#f2d4d7"},
  {name:"秋山眞緒",color:"ライトレッド",hex:"#e70033"},
];

const W = 320, CX = W/2, CY = W/2;
const R_OUT = 148, R_IN = 52;

function hexToRgb(hex) {
  const h = hex.replace('#','');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}

function rgbToHsl(r,g,b) {
  r/=255; g/=255; b/=255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b);
  let h,s,l=(max+min)/2;
  if(max===min){ h=0; s=0; }
  else {
    const d=max-min;
    s = l>0.5 ? d/(2-max-min) : d/(max+min);
    switch(max){
      case r: h=((g-b)/d+(g<b?6:0))/6; break;
      case g: h=((b-r)/d+2)/6; break;
      case b: h=((r-g)/d+4)/6; break;
    }
  }
  return [Math.round(h*360), Math.round(s*100), Math.round(l*100)];
}

function rgbTo8rgb(r,g,b) {
  const f = v => v===0?0:v===255?7:Math.round(v*7/255);
  return [f(r),f(g),f(b)];
}

function toHexStr(r,g,b) {
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0').toUpperCase()).join('');
}

// メンバーデータにHSL・座標を付与
const plotted = [];
members.forEach(m => {
  const [r,g,b] = hexToRgb(m.hex);
  const [h,s,l] = rgbToHsl(r,g,b);
  const [r8,g8,b8] = rgbTo8rgb(r,g,b);
  // S=0（無彩色）は中心付近に固定
  const sat = s/100;
  const radius = sat < 0.05 ? R_IN + 4 : R_IN + sat*(R_OUT-R_IN);
  const angle = (h/360)*Math.PI*2 - Math.PI/2;
  const x = CX + Math.cos(angle)*radius;
  const y = CY + Math.sin(angle)*radius;
  plotted.push({...m, h, s, l, r8, g8, b8, x, y, hex: m.hex.toUpperCase()});
});

// 同じHEXは同じ座標に重ねる、円外に出ないようクランプ
plotted.forEach(m => {
  // 円の中心からの距離をクランプ
  const dx = m.x - CX, dy = m.y - CY;
  const dist = Math.sqrt(dx*dx+dy*dy);
  const clampedDist = Math.min(dist, R_OUT - 8);
  const angle = Math.atan2(dy, dx);
  m.px = CX + Math.cos(angle)*clampedDist;
  m.py = CY + Math.sin(angle)*clampedDist;
});

const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');

function hslToRgbDraw(h,s,l) {
  const c=(1-Math.abs(2*l-1))*s;
  const x=c*(1-Math.abs((h/60)%2-1));
  const m=l-c/2;
  let r=0,g=0,b=0;
  if(h<60){r=c;g=x;}
  else if(h<120){r=x;g=c;}
  else if(h<180){g=c;b=x;}
  else if(h<240){g=x;b=c;}
  else if(h<300){r=x;b=c;}
  else{r=c;b=x;}
  return [Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)];
}

function drawWheel() {
  ctx.clearRect(0,0,W,W);
  const steps=360;
  for(let i=0;i<steps;i++) {
    const angle=(i/steps)*Math.PI*2-Math.PI/2;
    const nextAngle=((i+1)/steps)*Math.PI*2-Math.PI/2;
    const hue=(i/steps)*360;
    const grad=ctx.createRadialGradient(CX,CY,R_IN,CX,CY,R_OUT);
    const [r1,g1,b1]=hslToRgbDraw(hue,0,0.5);
    const [r2,g2,b2]=hslToRgbDraw(hue,1,0.5);
    grad.addColorStop(0,`rgb(${r1},${g1},${b1})`);
    grad.addColorStop(1,`rgb(${r2},${g2},${b2})`);
    ctx.beginPath();
    ctx.moveTo(CX+Math.cos(angle)*R_IN,CY+Math.sin(angle)*R_IN);
    ctx.arc(CX,CY,R_OUT,angle,nextAngle);
    ctx.arc(CX,CY,R_IN,nextAngle,angle,true);
    ctx.closePath();
    ctx.fillStyle=grad;
    ctx.fill();
  }

  // 同じHEXをグループ化してドット描画
  const hexGroups = {};
  plotted.forEach(m => {
    const key = m.hex.toUpperCase();
    if(!hexGroups[key]) hexGroups[key] = [];
    hexGroups[key].push(m);
  });

  const drawn = new Set();
  plotted.forEach(m => {
    const key = m.hex.toUpperCase();
    if(drawn.has(key)) return;
    drawn.add(key);
    const count = hexGroups[key].length;
    const radius = count > 1 ? 10 : 7;

    ctx.beginPath();
    ctx.arc(m.px, m.py, radius, 0, Math.PI*2);
    ctx.fillStyle = m.hex;
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(m.px, m.py, radius, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 1;
    ctx.stroke();

    if(count > 1) {
      // 明るさで文字色決定
      const [r,g,b] = hexToRgb(m.hex);
      const lum = 0.299*r + 0.587*g + 0.114*b;
      ctx.fillStyle = lum > 160 ? '#000' : '#fff';
      ctx.font = 'bold 9px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(count, m.px, m.py);
    }
  });
}

// クリック判定
let selected = null;
canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  let closest = null, minDist = 16;
  plotted.forEach(m => {
    const d = Math.sqrt((mx-m.px)**2+(my-m.py)**2);
    if(d < minDist) { minDist=d; closest=m; }
  });
  selected = closest;
  drawWheel();
  if(selected) {
    const selCount = plotted.filter(p=>p.hex.toUpperCase()===selected.hex.toUpperCase()).length;
    const selR = selCount > 1 ? 10 : 7;
    ctx.beginPath();
    ctx.arc(selected.px, selected.py, selR+4, 0, Math.PI*2);
    ctx.strokeStyle = '#111';
    ctx.lineWidth = 2.5;
    ctx.stroke();
  }
  updatePanel();
});

function updatePanel() {
  const panel = document.getElementById('info-panel');
  if(!selected) {
    panel.innerHTML = '<span class="info-empty">メンバーのドットをクリック</span>';
    return;
  }
  const m = selected;
  const code8 = `#$${m.r8}${m.g8}${m.b8}`;
  // 同じHEXのメンバーを全員取得
  const sameHex = plotted.filter(p => p.hex.toUpperCase() === m.hex.toUpperCase());
  const names = sameHex.map(p => p.name).join('、');
  const colorName = sameHex.map(p => p.color).filter((v,i,a)=>a.indexOf(v)===i).join(' / ');
  panel.innerHTML = `
    <div class="info-swatch" style="background:${m.hex};min-width:48px;height:48px;"></div>
    <div class="info-text">
      <div class="info-name" style="font-size:${sameHex.length>2?'13px':'16px'}">${names}</div>
      <div class="info-color-name">${colorName}</div>
      <div class="info-codes">
        <div class="info-code">HEX <span>${m.hex.toUpperCase()}</span></div>
        <div class="info-code">8RGB <span>${code8}</span></div>
        <div class="info-code">HSL <span>${m.s===0?`— , — , ${m.l}%`:`${m.h}° , ${m.s}% , ${m.l}%`}</span></div>
      </div>
    </div>
  `;
}

drawWheel();
</script>
